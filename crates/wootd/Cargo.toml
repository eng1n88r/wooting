[package]
name = "wootd"
description = "Wooting keyboard daemon: HTTP, Unix-socket JSON-RPC and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wooting-core.workspace = true
wooting-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
toml = "0.9"
dirs = "6"
