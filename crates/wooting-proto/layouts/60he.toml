# Wooting 60HE / 60HE+ (ANSI). Matrix rows/cols follow Wooting's RGB SDK
# matrix diagram; the 60% board leaves matrix row 0 unused. Geometry is in
# key units (1u = 19.05 mm). `cells` lists every matrix cell a key covers,
# primary first; the space bar has three LEDs.
